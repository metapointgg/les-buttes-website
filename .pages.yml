media:
  - name: images
    label: Website images
    input: src/assets/images
    output: /src/assets/images
    rename: safe
    categories: [image]
  - name: videos
    label: Website videos
    input: public/videos
    output: /videos
    rename: safe
    categories: [video]
    extensions: [mp4, webm]

components:
  seo:
    type: object
    label: Search and social sharing
    fields:
      - { name: title, label: Page title, type: string, required: true }
      - { name: description, label: Search description, type: text, required: true }

  pageSections:
    type: object
    label: Page sections
    description: Edit the sections used by each page. The website templates control their final layout and styling.
    list: { collapsible: { collapsed: true, summary: "{title}" } }
    fields:
      - { name: enabled, label: Show section, type: boolean, default: true }
      - name: type
        label: Section type
        type: select
        required: true
        options:
          values:
            - { value: text, label: Text }
            - { value: feature, label: Image and text }
            - { value: image, label: Single image }
            - { value: cards, label: Cards }
            - { value: iconCards, label: Icon cards }
            - { value: featureStrip, label: Feature strip }
            - { value: splitQuote, label: Split text and quote }
            - { value: cottageListing, label: Available cottage listing }
            - { value: list, label: List }
            - { value: gallery, label: Image gallery }
            - { value: quote, label: Quote / photographic testimonial }
            - { value: notice, label: Notice / information box }
            - { value: steps, label: Numbered steps }
            - { value: locationMap, label: Les Buttes location map }
            - { value: cta, label: Call to action }
            - { value: map, label: Map / large image }
      - name: theme
        label: Section background
        type: select
        default: auto
        options:
          values:
            - { value: auto, label: Automatic alternating }
            - { value: cream, label: Cream }
            - { value: paper, label: White }
            - { value: green, label: Green }
      - name: width
        label: Content width
        type: select
        default: standard
        options:
          values:
            - { value: standard, label: Standard }
            - { value: narrow, label: Narrow }
            - { value: wide, label: Wide }
      - { name: title, label: Section heading, type: string, required: true }
      - { name: text, label: Section text, type: text }
      - name: image
        label: Section image
        description: For Quote sections, adding an image creates a full-width photographic testimonial.
        type: image
        options: { media: images }
      - { name: imageAlt, label: Image description, type: text }
      - { name: imageCaption, label: Image caption, type: string }
      - name: imagePosition
        label: Image position
        type: select
        default: left
        options:
          values:
            - { value: left, label: Left }
            - { value: right, label: Right }
      - name: showCottagePreviewStrip
        label: Show cottage preview photographs
        description: Only applies to an Available cottage listing section.
        type: boolean
        default: false
      - name: items
        label: Cards / icon cards / feature strip / steps
        type: object
        list: { collapsible: { collapsed: true, summary: "{title}" } }
        fields:
          - { name: kicker, label: Small label / number, type: string }
          - { name: title, label: Item heading, type: string, required: true }
          - { name: text, label: Item text, type: text }
          - name: image
            label: Card image
            description: Optional image shown above the card text.
            type: image
            options: { media: images }
          - { name: imageAlt, label: Card image description, type: text }
          - name: icon
            label: Icon
            type: select
            options:
              values:
                - { value: beach, label: Beach }
                - { value: walk, label: Walking }
                - { value: guernsey, label: Guernsey }
                - { value: history, label: History }
                - { value: islands, label: Islands }
                - { value: food, label: Food }
                - { value: pin, label: Location }
                - { value: bed, label: Bed }
                - { value: bath, label: Bathroom }
                - { value: guests, label: Guests }
                - { value: kitchen, label: Kitchen }
                - { value: living, label: Living space }
                - { value: garden, label: Garden }
                - { value: wifi, label: Wi-Fi }
                - { value: phone, label: Phone }
                - { value: mail, label: Email }
                - { value: external, label: External link }
                - { value: arrow, label: Arrow }
          - { name: linkLabel, label: Link label, type: string }
          - { name: linkUrl, label: Link URL, type: string }
          - { name: external, label: Open link in new tab, type: boolean, default: false }
      - { name: listItems, label: List items, type: string, list: true }
      - name: galleryImages
        label: Gallery images
        type: object
        list: { collapsible: { collapsed: true, summary: "{caption}" } }
        fields:
          - name: image
            label: Image
            type: image
            required: true
            options: { media: images }
          - { name: alt, label: Image description, type: text }
          - { name: caption, label: Caption, type: string }
          - name: category
            label: Gallery category
            type: select
            options:
              values:
                - { value: cottages, label: Cottages }
                - { value: interiors, label: Interiors }
                - { value: gardens, label: Gardens }
                - { value: guernsey, label: Guernsey }
      - { name: quote, label: Quotation, type: text }
      - { name: attribution, label: Quote attribution / supporting note, type: string }
      - { name: buttonLabel, label: Button label, type: string }
      - { name: buttonUrl, label: Button URL, type: string }
      - { name: buttonExternal, label: Open button in new tab, type: boolean, default: false }
      - { name: secondaryButtonLabel, label: Secondary button label, type: string }
      - { name: secondaryButtonUrl, label: Secondary button URL, type: string }
      - { name: secondaryButtonExternal, label: Open secondary button in new tab, type: boolean, default: false }

  cottageSections:
    type: object
    label: Cottage page sections
    description: Add, remove and reorder the main content sections on the cottage page. Each section has text on the left and one to four images in a grid on the right.
    list:
      collapsible:
        collapsed: true
        summary: "{title}"
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: description, label: Description, type: text, required: true }
      - name: images
        label: Images
        description: Add between one and four images. One image is shown large; multiple images are arranged as a grid.
        type: object
        list:
          min: 1
          max: 4
          collapsible:
            collapsed: true
            summary: "{caption}"
        fields:
          - { name: image, label: Image, type: image, required: true, options: { media: images } }
          - { name: alt, label: Image description, type: text }
          - { name: caption, label: Optional caption, type: string }

  reviewList:
    type: object
    label: Guest reviews
    description: Add, remove and reorder guest reviews. Up to three reviews are shown at once on larger screens; additional reviews can be browsed in the carousel.
    list:
      collapsible:
        collapsed: true
        summary: "{userDetails}"
    fields:
      - { name: stars, label: Number of stars, type: number, required: true, default: 5 }
      - { name: comment, label: Review comment, type: text, required: true }
      - { name: userDetails, label: Guest details, description: For example Debbie, Airbnb guest., type: string, required: true }
      - { name: sourceUrl, label: Reviews page link, description: Link to the relevant Airbnb reviews page., type: string }
      - { name: sourceLabel, label: Link text, type: string, default: Read reviews on Airbnb }

content:
  - name: cottages
    label: Cottages
    type: collection
    path: src/content/cottages
    format: yaml-frontmatter
    filename: "{primary}.md"
    view: { primary: name, fields: [name, available, sleeps], sort: [name] }
    fields:
      - { name: name, label: Cottage name, type: string, required: true }
      - { name: slug, label: Web address, type: string, required: true, pattern: "^[a-z0-9-]+$" }
      - name: available
        label: Available on website
        description: Turn this on to show the cottage in listings, its cottage page and the sitemap.
        type: boolean
        default: true
        required: true
      - { name: tagline, label: Short description, type: string, required: true }
      - { name: summary, label: Cottage summary, type: text, required: true }
      - { name: sleeps, label: Guests, type: number, required: true }
      - { name: bedrooms, label: Bedrooms, type: number, required: true }
      - { name: beds, label: Beds, type: number, required: true }
      - { name: bathrooms, label: Bathrooms, type: number, required: true }
      - { name: dogFriendly, label: Dog friendly, type: boolean, required: true }
      - { name: airbnbUrl, label: Airbnb booking link, type: string }
      - name: heroMediaType
        label: Main media type
        description: Choose a photograph or an autoplaying silent video for the cottage hero.
        type: select
        default: image
        options:
          values:
            - { value: image, label: Image }
            - { value: video, label: Video }
      - name: heroImage
        label: Main image
        description: Used as the main image and as the fallback when video is selected.
        type: image
        required: true
        options: { media: images }
      - { name: heroAlt, label: Main image description, type: text, required: true }
      - { name: heroPan, label: Pan main image, description: Adds subtle lateral movement when the main media type is Image., type: boolean, default: false }
      - name: heroVideo
        label: Main video
        description: Optional MP4 or WebM background video. It plays muted, loops and has no controls.
        type: file
        options: { media: videos, categories: [video] }
      - name: heroPoster
        label: Video fallback image
        description: Optional still image shown while video loads and to visitors who prefer reduced motion.
        type: image
        options: { media: images }
      - { name: sections, component: cottageSections }
      - { name: facilities, label: What is included, type: string, list: true }
      - { name: reviews, component: reviewList }
      - name: gallery
        label: View gallery photographs
        description: Images opened from the View gallery button in the cottage hero.
        type: object
        list: { collapsible: { collapsed: true, summary: "{caption}" } }
        fields:
          - { name: image, label: Image, type: image, required: true, options: { media: images } }
          - { name: alt, label: Image description, type: text, required: true }
          - { name: caption, label: Caption, type: string, required: true }
      - { name: seo, component: seo }

  - name: pages
    label: Core pages
    type: collection
    path: src/content/pages
    format: yaml-frontmatter
    operations: { create: false, delete: false, rename: false }
    view:
      primary: seo.title
      fields: [seo.title, urlStub]
      sort: [seo.title]
      search: [seo.title, urlStub, title]
    fields:
      - { name: title, label: Main heading, type: string, required: true }
      - { name: urlStub, label: URL, type: string, required: true, readonly: true, pattern: "^/$|^/[a-z0-9-]+/$" }
      - { name: intro, label: Hero introduction, type: text, required: true }
      - name: heroMediaType
        label: Hero media type
        description: Choose whether the page hero uses an image or a silent looping video.
        type: select
        default: image
        options:
          values:
            - { value: image, label: Image }
            - { value: video, label: Video }
      - { name: heroImage, label: Hero image, type: image, options: { media: images } }
      - { name: heroAlt, label: Hero image description, type: text }
      - { name: heroPan, label: Pan hero image, type: boolean, default: false }
      - { name: heroVideo, label: Hero video, description: Optional MP4 or WebM. It autoplays muted and loops., type: file, options: { media: videos, categories: [video] } }
      - { name: heroPoster, label: Video fallback image, type: image, options: { media: images } }
      - { name: heroPrimaryLabel, label: Hero primary button label, type: string }
      - { name: heroPrimaryUrl, label: Hero primary button URL, type: string }
      - { name: heroSecondaryLabel, label: Hero secondary button label, type: string }
      - { name: heroSecondaryUrl, label: Hero secondary button URL, type: string }
      - { name: sections, component: pageSections }
      - { name: reviews, component: reviewList }
      - { name: seo, component: seo }

  - name: subpages
    label: Additional pages
    type: collection
    path: src/content/subpages
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      fields: [seo.title, slug, published]
      sort: [title]
      search: [title, slug, seo.title]
    fields:
      - { name: title, label: Main heading, type: string, required: true }
      - { name: slug, label: URL slug, description: The page address without slashes, for example gardens creates /gardens/., type: string, required: true, pattern: "^[a-z0-9-]+$" }
      - { name: published, label: Published on website, description: Turn this off to remove the page from the public website and sitemap., type: boolean, default: true, required: true }
      - { name: showInNavigation, label: Show in main navigation, type: boolean, default: false }
      - { name: navigationLabel, label: Navigation label, description: Optional shorter label for the main menu. If blank, the main heading is used., type: string }
      - { name: navigationOrder, label: Navigation order, description: Lower numbers appear earlier in the menu., type: number }
      - { name: intro, label: Hero introduction, type: text, required: true }
      - name: heroMediaType
        label: Hero media type
        type: select
        default: image
        options:
          values:
            - { value: image, label: Image }
            - { value: video, label: Video }
      - { name: heroImage, label: Hero image, type: image, options: { media: images } }
      - { name: heroAlt, label: Hero image description, type: text }
      - { name: heroPan, label: Pan hero image, type: boolean, default: false }
      - { name: heroVideo, label: Hero video, type: file, options: { media: videos, categories: [video] } }
      - { name: heroPoster, label: Video fallback image, type: image, options: { media: images } }
      - { name: heroPrimaryLabel, label: Hero primary button label, type: string }
      - { name: heroPrimaryUrl, label: Hero primary button URL, type: string }
      - { name: heroSecondaryLabel, label: Hero secondary button label, type: string }
      - { name: heroSecondaryUrl, label: Hero secondary button URL, type: string }
      - { name: sections, component: pageSections }
      - { name: seo, component: seo }

  - name: footer
    label: Footer
    type: file
    path: src/data/footer.json
    format: json
    fields:
      - name: intro
        label: Brand message
        type: object
        fields:
          - { name: enabled, label: Show brand message, type: boolean, default: true }
          - { name: label, label: Small heading, type: string }
          - { name: heading, label: Main heading, type: string }
          - { name: text, label: Supporting text, type: text }
      - name: logo
        label: Footer logo
        type: object
        fields:
          - { name: enabled, label: Show logo, type: boolean, default: true }
          - { name: image, label: Logo image, type: image, options: { media: images } }
          - { name: alt, label: Logo description, type: string }
      - name: columns
        label: Footer columns
        description: Add, remove or reorder footer columns and the items within them.
        type: object
        list: { collapsible: { collapsed: true, summary: "{title}" } }
        fields:
          - { name: title, label: Column heading, type: string, required: true }
          - name: items
            label: Items
            type: object
            list: { collapsible: { collapsed: true, summary: "{label}" } }
            fields:
              - { name: label, label: Text, description: For plain text such as an address, line breaks are preserved., type: text, required: true }
              - { name: url, label: Link URL, description: Leave blank to show this as plain text. Internal paths, mailto: and tel: links are supported., type: string }
              - name: icon
                label: Icon
                type: select
                options:
                  values:
                    - { value: pin, label: Location }
                    - { value: phone, label: Phone }
                    - { value: mail, label: Email }
                    - { value: external, label: External link }
                    - { value: arrow, label: Arrow }
              - { name: external, label: Open in new tab, type: boolean, default: false }
      - name: bottom
        label: Bottom line
        type: object
        fields:
          - { name: copyrightName, label: Copyright name, type: string }
          - { name: note, label: Right-hand note, type: string }

  - name: design
    label: Design settings
    type: file
    path: src/data/design.json
    format: json
    fields:
      - name: typography
        label: Typography
        description: Global font choices and type sizes used across all page templates. Changes here apply site-wide.
        type: object
        fields:
          - name: bodyFont
            label: Body font
            type: select
            required: true
            options:
              values:
                - { value: systemSans, label: System sans / Inter (current) }
                - { value: humanistSans, label: Humanist sans / Avenir }
                - { value: classicSerif, label: Classic serif / Georgia }
          - name: headingFont
            label: Heading font
            type: select
            required: true
            options:
              values:
                - { value: heritageSerif, label: Heritage serif / Iowan & Baskerville (current) }
                - { value: georgia, label: Georgia serif }
                - { value: systemSans, label: System sans / Inter }
          - { name: bodySize, label: Body text size (px), type: number, required: true, description: Standard paragraph and navigation text. Current value 16. }
          - { name: bodyLineHeight, label: Body line height, type: number, required: true, description: Current value 1.7. }
          - { name: headingLineHeight, label: Heading line height, type: number, required: true, description: Current value 1.08. }
          - { name: pageTitleMin, label: Page title minimum (px), type: number, required: true }
          - { name: pageTitleMax, label: Page title maximum (px), type: number, required: true }
          - { name: homeTitleMin, label: Homepage hero title minimum (px), type: number, required: true }
          - { name: homeTitleMax, label: Homepage hero title maximum (px), type: number, required: true }
          - { name: sectionTitleMin, label: Section heading minimum (px), type: number, required: true }
          - { name: sectionTitleMax, label: Section heading maximum (px), type: number, required: true }
          - { name: subheadingMin, label: Subheading minimum (px), type: number, required: true }
          - { name: subheadingMax, label: Subheading maximum (px), type: number, required: true }
          - { name: cottageTitleMin, label: Cottage card title minimum (px), type: number, required: true }
          - { name: cottageTitleMax, label: Cottage card title maximum (px), type: number, required: true }
          - { name: leadMin, label: Intro / lead text minimum (px), type: number, required: true }
          - { name: leadMax, label: Intro / lead text maximum (px), type: number, required: true }
          - { name: proseSize, label: Long-form text size (px), type: number, required: true }
          - { name: smallCardHeadingSize, label: Small card heading size (px), type: number, required: true }
          - { name: buttonSize, label: Button text size (px), type: number, required: true }
          - { name: smallTextSize, label: Small text / captions size (px), type: number, required: true }
          - { name: quoteMin, label: Quote minimum (px), type: number, required: true }
          - { name: quoteMax, label: Quote maximum (px), type: number, required: true }

  - name: site
    label: Site settings
    type: file
    path: src/data/site.json
    format: json
    fields:
      - { name: name, label: Site name, type: string, required: true }
      - { name: shortName, label: Short site name, type: string, required: true }
      - { name: url, label: Website URL, type: string, required: true }
      - { name: email, label: Email, type: string, required: true }
      - { name: telephoneDisplay, label: Telephone display, type: string, required: true }
      - { name: telephoneHref, label: Telephone link value, type: string, required: true }
      - name: address
        label: Address
        type: object
        fields:
          - { name: street, label: Street, type: string }
          - { name: locality, label: Parish / locality, type: string }
          - { name: island, label: Island, type: string }
          - { name: postcode, label: Postcode, type: string }
          - { name: country, label: Country, type: string }
      - name: coordinates
        label: Map coordinates
        type: object
        fields:
          - { name: latitude, label: Latitude, type: number }
          - { name: longitude, label: Longitude, type: number }
      - name: airbnb
        label: Airbnb links
        type: object
        fields:
          - { name: geranium, label: Geranium, type: string }
          - { name: honeysuckle, label: Honeysuckle, type: string }

settings:
  commit:
    templates:
      create: "content: add {filename}"
      update: "content: update {filename}"
      delete: "content: remove {filename}"
      rename: "content: rename {oldFilename} to {newFilename}"
