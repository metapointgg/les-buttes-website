media:
  - name: images
    label: Cottage images
    input: src/assets/images
    output: /src/assets/images
    rename: safe
    categories: [image]
  - name: videos
    label: Website videos
    input: public/videos
    output: /videos
    rename: safe
    categories: [video]
    extensions: [mp4, webm]
components:
  seo:
    type: object
    label: Search and social sharing
    fields:
      - { name: title, label: Page title, type: string, required: true }
      - { name: description, label: Search description, type: text, required: true }
content:
  - name: cottages
    label: Cottages
    type: collection
    path: src/content/cottages
    format: yaml-frontmatter
    filename: "{primary}.md"
    view: { primary: name, fields: [name, status, sleeps], sort: [name, status] }
    fields:
      - { name: name, label: Cottage name, type: string, required: true }
      - { name: slug, label: Web address, type: string, required: true, pattern: "^[a-z0-9-]+$" }
      - { name: eyebrow, label: Short heading, type: string, required: true }
      - { name: tagline, type: string, required: true }
      - { name: summary, type: text, required: true }
      - name: status
        type: select
        required: true
        options:
          values:
            - { value: available, label: Available to book }
            - { value: coming-soon, label: Not currently available }
      - { name: sleeps, label: Guests, type: number, required: true }
      - { name: bedrooms, type: number, required: true }
      - { name: beds, type: number, required: true }
      - { name: bathrooms, type: number, required: true }
      - { name: dogFriendly, label: Dog friendly, type: boolean, required: true }
      - { name: airbnbUrl, label: Airbnb booking link, type: string }
      - name: heroMediaType
        label: Main media type
        description: Choose a photograph or an autoplaying silent video for the cottage's main feature media.
        type: select
        default: image
        options:
          values:
            - { value: image, label: Image }
            - { value: video, label: Video }
      - name: heroImage
        label: Main image
        description: Used as the main image, and as the fallback when video is selected.
        type: image
        required: true
        options: { media: images }
      - { name: heroAlt, label: Main image description, type: text, required: true }
      - name: heroPan
        label: Pan main image
        description: Adds subtle lateral movement when the main media type is Image. Gallery photographs remain static.
        type: boolean
        default: false
      - name: heroVideo
        label: Main video
        description: Optional MP4 or WebM background video. It plays muted, loops and has no controls.
        type: file
        options: { media: videos, categories: [video] }
      - name: heroPoster
        label: Video fallback image
        description: Optional still image shown while video loads and to visitors who prefer reduced motion. If omitted, Main image is used.
        type: image
        options: { media: images }
      - name: gallery
        label: Photo gallery
        type: object
        list: { collapsible: { collapsed: true, summary: "{caption}" } }
        fields:
          - name: image
            type: image
            required: true
            options: { media: images }
          - { name: alt, label: Image description, type: text, required: true }
          - { name: caption, type: string, required: true }
      - { name: facilities, label: What is included, type: string, list: true }
      - name: highlights
        type: object
        list: { collapsible: { collapsed: true, summary: "{title}" } }
        fields:
          - { name: title, type: string, required: true }
          - { name: text, type: text, required: true }
      - name: review
        label: Featured guest review
        type: object
        fields:
          - { name: quote, type: text }
          - { name: guest, type: string }
          - { name: sourceUrl, label: Airbnb review link, type: string }
      - { name: seo, component: seo }
      - name: body
        label: Main description
        type: rich-text
        required: true
        options: { media: images }
  - name: pages
    label: General pages
    type: collection
    path: src/content/pages
    format: yaml-frontmatter
    operations: { create: false, delete: false, rename: false }
    view:
      primary: seo.title
      fields: [seo.title, urlStub]
      sort: [seo.title]
      search: [seo.title, urlStub, title, eyebrow]
    fields:
      - { name: title, label: Main heading, type: string, required: true }
      - { name: urlStub, label: URL stub, type: string, required: true, readonly: true, pattern: "^/$|^/[a-z0-9-]+/$" }
      - { name: eyebrow, label: Short heading, type: string, required: true }
      - { name: intro, label: Introduction, type: text, required: true }
      - name: heroMediaType
        label: Main media type
        description: Choose whether the page's principal feature media is an image or a silent looping video.
        type: select
        default: image
        options:
          values:
            - { value: image, label: Image }
            - { value: video, label: Video }
      - name: heroImage
        label: Page main image
        description: Used on the Home and About pages and as the still/fallback image for an Explore Guernsey hero video.
        type: image
        options: { media: images }
      - name: heroAlt
        label: Page main image description
        description: Briefly describe the main image for visitors using screen readers.
        type: text
      - name: heroPan
        label: Pan page main image
        description: Adds subtle lateral movement when the main media type is Image.
        type: boolean
        default: false
      - name: heroVideo
        label: Page main video
        description: Optional MP4 or WebM. It autoplays muted, loops and is replaced by the fallback image for reduced-motion visitors.
        type: file
        options: { media: videos, categories: [video] }
      - name: heroPoster
        label: Video fallback image
        description: Optional still image shown while video loads and when motion is disabled. If omitted, Page main image is used.
        type: image
        options: { media: images }
      - name: experienceImage
        label: Explore Guernsey feature image
        description: Used beside the Island experiences text on the Things to do page.
        type: image
        options: { media: images }
      - name: experienceImageAlt
        label: Explore Guernsey image description
        description: Briefly describe the feature image for visitors using screen readers.
        type: text
      - name: experienceImagePan
        label: Pan Explore Guernsey feature image
        description: Adds subtle lateral movement to the Island experiences image.
        type: boolean
        default: false
      - { name: welcomeEyebrow, label: Homepage welcome short heading, type: string }
      - { name: welcomeTitle, label: Homepage welcome heading, type: string }
      - { name: welcomeQuote, label: Homepage welcome quotation, type: text }
      - { name: welcomeNote, label: Homepage welcome note, type: text }
      - { name: seo, component: seo }
      - name: body
        label: Main page text
        type: rich-text
        required: true
        options: { media: images }
  - name: site
    label: Site settings
    type: file
    path: src/data/site.json
    format: json
    fields:
      - { name: name, type: string, required: true }
      - { name: shortName, type: string, required: true }
      - { name: url, type: string, required: true }
      - { name: email, type: string, required: true }
      - { name: telephoneDisplay, type: string, required: true }
      - { name: telephoneHref, type: string, required: true }
      - name: address
        type: object
        fields:
          - { name: street, type: string }
          - { name: locality, type: string }
          - { name: island, type: string }
          - { name: postcode, type: string }
          - { name: country, type: string }
      - name: coordinates
        type: object
        fields:
          - { name: latitude, type: number }
          - { name: longitude, type: number }
      - name: airbnb
        type: object
        fields:
          - { name: geranium, type: string }
          - { name: honeysuckle, type: string }
settings:
  commit:
    templates:
      create: "content: add {filename}"
      update: "content: update {filename}"
      delete: "content: remove {filename}"
      rename: "content: rename {oldFilename} to {newFilename}"
