name: LB-08 isolated management CREATE-only change-set preview
on:
  workflow_dispatch:
  push:
    branches: [feature/direct-booking-requests-27-night]
    paths:
      - '.github/workflows/lb08-isolated-management-preview.yml'
      - 'services/booking-api/staging-management-preview-isolated.template.yaml'
      - 'services/booking-api/lb08-isolated-management-review-cli.mjs'
permissions:
  contents: read
  id-token: write
concurrency:
  group: lb08-isolated-management-create-preview
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: aws-actions/setup-sam@v2
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::145608514666:role/les-buttes-booking-private-staging-deploy
          aws-region: eu-west-2
          role-session-name: lb08-management-preview-only
      - name: Verify account and source staging stack (existing table/index independently verified)
        shell: bash
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = '145608514666'
          test "$(aws cloudformation describe-stacks --stack-name les-buttes-booking-staging --query 'Stacks[0].StackStatus' --output text)" = 'UPDATE_COMPLETE'
          if aws cloudformation describe-stacks --stack-name les-buttes-management-preview-isolated-staging --query 'Stacks[0].StackStatus' --output text 2>/dev/null; then
            echo '::error::Isolated management stack already exists; refusing UPDATE'
            exit 1
          fi
      - name: Validate full backend and isolated SAM template
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix services/booking-api ci --no-audit --no-fund
          npm --prefix services/booking-api run check
          npm --prefix services/booking-api test
          sam validate --template-file services/booking-api/staging-management-preview-isolated.template.yaml
          echo 'Backend tests and isolated SAM template validation succeeded.' >> "$GITHUB_STEP_SUMMARY"
      - name: Build and inspect executable Lambda package
        shell: bash
        run: |
          set -euo pipefail
          sam build --template-file services/booking-api/staging-management-preview-isolated.template.yaml --build-dir .aws-sam/lb08-management-preview --region eu-west-2
          echo 'Inspecting SAM build directory for the packaged Lambda:'
          ls -la .aws-sam/lb08-management-preview/
          test -s .aws-sam/lb08-management-preview/ManagementPreviewReadFunction/booking-admin-http.mjs || { echo '::error::Booking admin HTTP handler missing from SAM package'; exit 1; }
          test -d .aws-sam/lb08-management-preview/ManagementPreviewReadFunction/node_modules/@aws-sdk/client-dynamodb || { echo '::error::DynamoDB SDK missing from SAM package'; exit 1; }
          sam package --template-file .aws-sam/lb08-management-preview/template.yaml --s3-bucket les-buttes-cottage-manag-artifacts-145608514666-eu-west-2 --s3-prefix booking-management-preview-isolated/sam --region eu-west-2 --output-template-file .aws-sam/lb08-management-preview-packaged.yaml
      - name: Create a NON-EXECUTED isolated stack change set
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          name="lb08-management-isolated-$(date -u +%Y%m%d%H%M%S)"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          aws cloudformation create-change-set \
            --stack-name les-buttes-management-preview-isolated-staging \
            --change-set-name "$name" \
            --change-set-type CREATE \
            --template-body file://.aws-sam/lb08-management-preview-packaged.yaml \
            --parameters ParameterKey=StagingBookingTableName,ParameterValue=les-buttes-booking-staging-BookingTable-RXRKLOG7NOXK \
            --capabilities CAPABILITY_IAM CAPABILITY_AUTO_EXPAND \
            --region eu-west-2 \
            --description 'LB08 isolated Cognito GET-only management review; DO NOT EXECUTE' \
            --query 'Id' --output text
          echo 'A CloudFormation change set was created but NOT executed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Inspect expected CREATE-only resources, with no execution
        shell: bash
        env:
          CHANGE_SET_NAME: ${{ steps.prepare.outputs.name }}
        run: |
          set -euo pipefail
          aws cloudformation wait change-set-create-complete \
            --stack-name les-buttes-management-preview-isolated-staging \
            --change-set-name "$CHANGE_SET_NAME" --region eu-west-2
          aws cloudformation describe-change-set \
            --stack-name les-buttes-management-preview-isolated-staging \
            --change-set-name "$CHANGE_SET_NAME" --region eu-west-2 \
            --query '{Status:Status,ExecutionStatus:ExecutionStatus,Changes:Changes}' --output json |
            node services/booking-api/lb08-isolated-management-review-cli.mjs
          echo "Review-only change set: $CHANGE_SET_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo 'No change set was executed. Manual inspection of IAM and JWT still required.' >> "$GITHUB_STEP_SUMMARY"

      - name: Explain safe failure and next diagnostic action
        if: failure()
        shell: bash
        run: |
          echo '::warning::Isolated management CREATE-only preview failed. No change set was executed.'
          echo "Failed workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          echo 'Inspect the first failing step for actionable diagnostics.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No sam deploy, cloudformation execute-change-set or production mutation is present.' >> "$GITHUB_STEP_SUMMARY"
