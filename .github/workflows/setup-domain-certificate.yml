name: Setup domain certificate

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/setup-domain-certificate.yml

permissions:
  contents: read
  id-token: write

env:
  AWS_ROLE_ARN: arn:aws:iam::145608514666:role/les-buttes-github-deploy

jobs:
  request-certificate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Request or find ACM certificate
        shell: bash
        run: |
          set -euo pipefail
          CERT_ARN=$(aws acm list-certificates \
            --region us-east-1 \
            --certificate-statuses PENDING_VALIDATION ISSUED \
            --query "CertificateSummaryList[?DomainName=='lesbuttes.com'].CertificateArn | [0]" \
            --output text)

          if [[ -z "$CERT_ARN" || "$CERT_ARN" == "None" ]]; then
            CERT_ARN=$(aws acm request-certificate \
              --region us-east-1 \
              --domain-name lesbuttes.com \
              --subject-alternative-names www.lesbuttes.com \
              --validation-method DNS \
              --idempotency-token lesbuttes2026 \
              --query CertificateArn \
              --output text)
            echo "Requested new certificate: $CERT_ARN"
          else
            echo "Using existing certificate: $CERT_ARN"
          fi

          echo "certificate_arn=$CERT_ARN" >> "$GITHUB_OUTPUT"

          for attempt in {1..12}; do
            COUNT=$(aws acm describe-certificate \
              --region us-east-1 \
              --certificate-arn "$CERT_ARN" \
              --query "length(Certificate.DomainValidationOptions[?ResourceRecord.Name!=null])" \
              --output text)
            if [[ "$COUNT" != "0" ]]; then
              break
            fi
            sleep 5
          done

          echo "Certificate status and DNS validation records:"
          aws acm describe-certificate \
            --region us-east-1 \
            --certificate-arn "$CERT_ARN" \
            --query "{CertificateArn:Certificate.CertificateArn,Status:Certificate.Status,Validation:Certificate.DomainValidationOptions[].{Domain:DomainName,Status:ValidationStatus,Name:ResourceRecord.Name,Type:ResourceRecord.Type,Value:ResourceRecord.Value}}" \
            --output json
