name: Package reviewed production booking backend
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/package-production-booking.yml
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: booking-backend-release
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/booking-api/package-lock.json
      - name: Install production booking dependencies
        run: npm ci --prefix services/booking-api
      - name: Test production booking backend
        run: npm test --prefix services/booking-api
      - name: Package production Lambda handlers and dependencies
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          root = Path('services/booking-api')
          destination = Path('/tmp/les-buttes-production-integrations.zip')
          required = (
              'production-admin-transaction-handler.mjs',
              'production-request-handler.mjs',
              'production-balance-reminder-runner.mjs',
              'production-payment-settings.mjs',
              'production-guest-balance-handler.mjs',
              'production-payment-schedule.mjs',
              'package.json',
          )
          for name in required:
              assert (root / name).is_file(), f'Missing required Lambda module: {name}'
          with ZipFile(destination, 'w', ZIP_DEFLATED, compresslevel=6) as archive:
              for path in sorted(root.rglob('*')):
                  if not path.is_file():
                      continue
                  rel = path.relative_to(root)
                  if any(part.startswith('.') for part in rel.parts):
                      continue
                  if path.name.endswith('.test.mjs') or path.name.endswith('.test.js'):
                      continue
                  archive.write(path, rel.as_posix())
          with ZipFile(destination) as archive:
              assert archive.testzip() is None
              assert all(name in archive.namelist() for name in required)
          print(f'Validated Lambda artefact: {destination.stat().st_size} bytes')
          PY
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::145608514666:role/les-buttes-github-deploy
          aws-region: eu-west-2
      - name: Upload versioned reviewed artefact only
        env:
          RELEASE_BUCKET: les-buttes-payment-staging-145608514666-eu-west-2
        run: |
          set -euo pipefail
          KEY="production-transactional/releases/${GITHUB_SHA}/les-buttes-production-integrations.zip"
          aws s3api put-object --bucket "$RELEASE_BUCKET" --key "$KEY" \
            --body /tmp/les-buttes-production-integrations.zip \
            --metadata "source-commit=${GITHUB_SHA},release-type=booking-backend"
          aws s3api head-object --bucket "$RELEASE_BUCKET" --key "$KEY" \
            --query '{VersionId:VersionId,Length:ContentLength,Metadata:Metadata}' --output json
          echo "Packaged only. CloudFormation release and payment-policy activation are separate reviewed actions."
