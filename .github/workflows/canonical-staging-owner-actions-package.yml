name: Package canonical staging owner actions Lambda (review only)

on:
  workflow_dispatch:
  push:
    branches: [feature/direct-booking-requests-27-night]
    paths:
      - '.github/workflows/canonical-staging-owner-actions-package.yml'
      - 'services/booking-api/**'

permissions:
  contents: read
  id-token: write

jobs:
  package-for-review:
    if: github.ref == 'refs/heads/feature/direct-booking-requests-27-night'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate booking API and staging route contract
        working-directory: services/booking-api
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run check
          npm test
      - name: Assemble immutable review candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cd services/booking-api
          zip -q -r ../../dist/canonical-staging-owner-actions-lambda.zip . \
            -x '*.test.mjs' 'test/*' 'node_modules/.cache/*'
          cd ../..
          (cd dist && sha256sum canonical-staging-owner-actions-lambda.zip | tee SHA256SUMS)
          test -s dist/canonical-staging-owner-actions-lambda.zip
          unzip -tq dist/canonical-staging-owner-actions-lambda.zip
          unzip -Z1 dist/canonical-staging-owner-actions-lambda.zip | grep -Fx 'booking-admin-http.mjs'
          unzip -Z1 dist/canonical-staging-owner-actions-lambda.zip | grep -Fx 'staging-owner-action-route-handler.mjs'
          unzip -Z1 dist/canonical-staging-owner-actions-lambda.zip | grep -Fx 'node_modules/@aws-sdk/client-dynamodb/package.json'
          unzip -Z1 dist/canonical-staging-owner-actions-lambda.zip | grep -Fx 'node_modules/@aws-sdk/lib-dynamodb/package.json'
          (cd dist && sha256sum --check SHA256SUMS)
          printf 'source_commit=%s\nsource_ref=%s\nworkflow_run=%s\n' \
            "$GITHUB_SHA" "$GITHUB_REF" "$GITHUB_RUN_ID" > dist/SOURCE_MANIFEST
          grep -Fx "source_commit=$GITHUB_SHA" dist/SOURCE_MANIFEST
      - name: Upload review artefact only
        uses: actions/upload-artifact@v4
        with:
          name: canonical-staging-owner-actions-lambda-${{ github.sha }}
          path: |
            dist/canonical-staging-owner-actions-lambda.zip
            dist/SHA256SUMS
            dist/SOURCE_MANIFEST
          retention-days: 14
      - name: Authenticate to isolated staging artefact bucket only
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::145608514666:role/les-buttes-booking-private-staging-deploy
          aws-region: eu-west-2
          role-session-name: owner-actions-artifact-review-only
      - name: Upload immutable versioned staging owner-actions review candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = '145608514666'
          bucket='les-buttes-payment-staging-145608514666-eu-west-2'
          test "$(aws s3api get-bucket-versioning --bucket "$bucket" --query Status --output text)" = 'Enabled'
          key="owner-actions-review/${GITHUB_SHA}/canonical-staging-owner-actions-lambda.zip"
          version="$(aws s3api put-object --bucket "$bucket" --key "$key" \
            --body dist/canonical-staging-owner-actions-lambda.zip \
            --server-side-encryption AES256 --query VersionId --output text)"
          test -n "$version" && test "$version" != 'None' && test "$version" != 'null'
          aws s3api head-object --bucket "$bucket" --key "$key" --version-id "$version" \
            --query '{VersionId:VersionId,Size:ContentLength,Encryption:ServerSideEncryption}' --output json
          {
            echo "Versioned staging owner-actions review artefact: s3://$bucket/$key"
            echo "S3 object version: $version"
            echo "GitHub source commit: $GITHUB_SHA"
            echo 'No CloudFormation deployment, API route activation or owner-actions writes were performed.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Record safety boundary
        run: |
          {
            echo '## Canonical staging owner-actions Lambda review package'
            echo 'Source commit: ${{ github.sha }}'
            echo 'Package is retained as a GitHub Actions artefact and uploaded to a private versioned staging S3 bucket.'
            echo 'AWS credentials were used only for the isolated S3 artefact upload; no CloudFormation execution, route activation or owner-actions operations were performed.'
            echo 'Review the S3 bucket/key/version printed above before any separately approved CloudFormation change set.'
          } >> "$GITHUB_STEP_SUMMARY"
