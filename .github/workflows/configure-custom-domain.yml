name: Configure public website custom domain

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/configure-custom-domain.yml

permissions:
  contents: read
  id-token: write

env:
  AWS_ROLE_ARN: arn:aws:iam::145608514666:role/les-buttes-github-deploy
  AWS_REGION: eu-west-2
  CLOUDFRONT_DISTRIBUTION_ID: E1VSQS2DENGIJR
  ACM_CERTIFICATE_ARN: arn:aws:acm:us-east-1:145608514666:certificate/5c2d23e0-905f-4fbe-9ab3-3bcaf10cfe8e

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read current CloudFront configuration
        run: |
          aws cloudfront get-distribution-config \
            --id "$CLOUDFRONT_DISTRIBUTION_ID" \
            > /tmp/distribution.json
          jq -r '.ETag' /tmp/distribution.json > /tmp/etag

      - name: Configure aliases and certificate
        run: |
          jq --arg cert "$ACM_CERTIFICATE_ARN" '
            .DistributionConfig
            | .Aliases = {
                Quantity: 2,
                Items: ["lesbuttes.com", "www.lesbuttes.com"]
              }
            | .ViewerCertificate = {
                CloudFrontDefaultCertificate: false,
                ACMCertificateArn: $cert,
                SSLSupportMethod: "sni-only",
                MinimumProtocolVersion: "TLSv1.2_2021"
              }
          ' /tmp/distribution.json > /tmp/updated-config.json

          aws cloudfront update-distribution \
            --id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --if-match "$(cat /tmp/etag)" \
            --distribution-config file:///tmp/updated-config.json \
            > /tmp/update-result.json

      - name: Wait for CloudFront deployment
        run: |
          aws cloudfront wait distribution-deployed \
            --id "$CLOUDFRONT_DISTRIBUTION_ID"

      - name: Verify custom domain configuration
        run: |
          aws cloudfront get-distribution \
            --id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --query 'Distribution.{Status:Status,DomainName:DomainName,Aliases:DistributionConfig.Aliases.Items,Certificate:DistributionConfig.ViewerCertificate.ACMCertificateArn,MinimumProtocolVersion:DistributionConfig.ViewerCertificate.MinimumProtocolVersion}' \
            --output json

          test "$(aws cloudfront get-distribution --id "$CLOUDFRONT_DISTRIBUTION_ID" --query 'Distribution.Status' --output text)" = "Deployed"
          test "$(aws cloudfront get-distribution --id "$CLOUDFRONT_DISTRIBUTION_ID" --query 'Distribution.DistributionConfig.ViewerCertificate.ACMCertificateArn' --output text)" = "$ACM_CERTIFICATE_ARN"
          aws cloudfront get-distribution --id "$CLOUDFRONT_DISTRIBUTION_ID" --query 'Distribution.DistributionConfig.Aliases.Items' --output text | grep -qw 'lesbuttes.com'
          aws cloudfront get-distribution --id "$CLOUDFRONT_DISTRIBUTION_ID" --query 'Distribution.DistributionConfig.Aliases.Items' --output text | grep -qw 'www.lesbuttes.com'
