name: Inspect booking staging CloudFormation (read only)
on:
  push:
    branches: [chore/staging-preflight-inspection-20261028]
    paths: ['.github/workflows/inspect-booking-staging.yml']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
  issues: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Assume existing AWS GitHub role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::145608514666:role/les-buttes-github-staging-inspect
          aws-region: eu-west-2
      - name: Verify account and inspect staging stacks
        shell: bash
        run: |
          set -euo pipefail
          account="$(aws sts get-caller-identity --query Account --output text)"
          if [[ "$account" != "145608514666" ]]; then
            echo "::error::Unexpected AWS account"
            exit 1
          fi
          echo "AWS account verified; inspecting CloudFormation only."
          aws cloudformation describe-stacks --region eu-west-2 \
            --query "Stacks[?(contains(StackName, 'booking') || contains(StackName, 'private-availability')) && contains(StackName, 'staging')].[StackName,StackStatus]" --output table
          stacks="$(aws cloudformation list-stacks --region eu-west-2 \
            --stack-status-filter CREATE_COMPLETE UPDATE_COMPLETE UPDATE_ROLLBACK_COMPLETE UPDATE_IN_PROGRESS UPDATE_ROLLBACK_IN_PROGRESS REVIEW_IN_PROGRESS CREATE_IN_PROGRESS CREATE_FAILED UPDATE_FAILED UPDATE_ROLLBACK_FAILED ROLLBACK_FAILED ROLLBACK_IN_PROGRESS ROLLBACK_COMPLETE \
            --query "StackSummaries[?(contains(StackName, 'booking') || contains(StackName, 'private-availability')) && contains(StackName, 'staging')].StackName" --output text)"
          # A successful inspection must not silently accept failed staging stacks.
          failed="$(aws cloudformation list-stacks --region eu-west-2 \\
            --stack-status-filter CREATE_FAILED UPDATE_FAILED UPDATE_ROLLBACK_FAILED ROLLBACK_FAILED DELETE_FAILED IMPORT_ROLLBACK_FAILED \\
            --query "StackSummaries[?((contains(StackName, 'booking') || contains(StackName, 'private-availability')) && contains(StackName, 'staging'))].StackName" --output text)"
          if [[ -n "$failed" ]]; then
            echo "::error::Failed staging CloudFormation stack(s): $failed"
            exit 1
          fi
          if [[ -z "$stacks" ]]; then
            echo "::warning::No matching staging booking stack found."
            exit 0
          fi
          for stack in $stacks; do
            echo "::group::Change sets for $stack"
            aws cloudformation list-change-sets --region eu-west-2 --stack-name "$stack" \
              --query "Summaries[].{Name:ChangeSetName,Status:Status,Execution:ExecutionStatus,Created:CreationTime}" --output table
            echo "::endgroup::"
          done

      - name: Notify on staging inspection failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          title="Les Buttes staging inspection failed"
          body="$(printf 'A staging-only inspection run failed.\n\nRun: %s\nBranch: %s\nCommit: %s\n\nInspect the run logs before making changes. No deployment is authorised by this alert.\n' "$RUN_URL" "$BRANCH" "$GITHUB_SHA")"
          existing="$(gh issue list --repo "$REPO" --state open --search "$title in:title" --json number,title --jq '.[] | select(.title == "Les Buttes staging inspection failed") | .number' | head -n 1)"
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "$title" --body "$body"
          fi
      - name: Notify on staging inspection success
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          title="Les Buttes staging inspection passed"
          body="$(printf 'Read-only staging inspection completed successfully.\n\nRun: %s\nBranch: %s\nCommit: %s\n\nThis does not authorise deployment or execution of pending change sets.\n' "$RUN_URL" "$BRANCH" "$GITHUB_SHA")"
          existing="$(gh issue list --repo "$REPO" --state open --search "$title in:title" --json number,title --jq '.[] | select(.title == "Les Buttes staging inspection passed") | .number' | head -n 1)"
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "$title" --body "$body"
          fi
      - name: Record inspection result
        if: ${{ always() }}
        shell: bash
        run: |
          echo "Inspection workflow: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
