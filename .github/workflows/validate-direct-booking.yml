name: Validate direct-booking website (no deployment)
on:
  push:
    branches: [chore/staging-preflight-inspection-20261028]
    paths: ['.github/workflows/validate-direct-booking.yml']
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout direct booking feature
        uses: actions/checkout@v4
        with:
          ref: feature/direct-booking-requests-27-night
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build and validate links
        run: npm test
      - name: Verify booking pages and record source revision
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/book/index.html
          test -s dist/fr/book/index.html
          test -s dist/nl/book/index.html
          echo "Source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Build revision: $(git rev-parse HEAD)" > dist/BUILD-REVISION.txt
          echo "Built at: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> dist/BUILD-REVISION.txt
          echo "Booking pages verified for English, French and Dutch." >> "$GITHUB_STEP_SUMMARY"
          echo "## Booking page output" >> "$GITHUB_STEP_SUMMARY"
          for page in dist/book/index.html dist/fr/book/index.html dist/nl/book/index.html; do
            printf '%s: %s bytes\\n' "$page" "$(wc -c < "$page")" >> "$GITHUB_STEP_SUMMARY"
          done
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > dist/BUILD-SHA256SUMS.txt
          echo "Generated SHA-256 manifest for staging artifact integrity." >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve built website for staging review
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: les-buttes-direct-booking-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Notify result
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULT: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          title="Les Buttes direct booking website build"
          body="$(printf 'Website build and validation: %s\n\nRun: %s\nSource branch: feature/direct-booking-requests-27-night\n\nNo deployment or production changes performed.\n' "$RESULT" "$RUN_URL")"
          existing="$(gh issue list --repo "$REPO" --state open --search "$title in:title" --json number,title --jq '.[] | select(.title == "Les Buttes direct booking website build") | .number' | head -n 1)"
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "$title" --body "$body"
          fi
