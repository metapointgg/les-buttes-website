name: Package final production booking emails
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/package-final-production-email-release.yml'
permissions:
  contents: read
  id-token: write
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install production dependencies
        run: npm ci --prefix services/booking-api --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Verify all production lifecycle email and SES tests
        run: |
          set -euo pipefail
          node --test services/booking-api/booking-lifecycle-email-templates.test.mjs services/booking-api/booking-production-email.test.mjs
      - name: Assemble audited production integration package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          (cd services/booking-api && zip -q -r ../../dist/les-buttes-production-integrations.zip . -x '*.test.mjs' 'test/*' 'node_modules/.cache/*')
          unzip -tq dist/les-buttes-production-integrations.zip
          for file in booking-lifecycle-email-templates.mjs booking-branded-email-html.mjs booking-request-email-preparation.mjs booking-production-ses-transport.mjs production-request-handler.mjs production-admin-transaction-handler.mjs; do
            unzip -Z1 dist/les-buttes-production-integrations.zip | grep -Fx "$file"
          done
          sha256sum dist/les-buttes-production-integrations.zip
      - name: Authenticate through existing website deployment role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::145608514666:role/les-buttes-github-deploy
          aws-region: eu-west-2
          role-session-name: final-production-email-review
      - name: Upload immutable private package only
        shell: bash
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = '145608514666'
          bucket=les-buttes-payment-staging-145608514666-eu-west-2
          test "$(aws s3api get-bucket-versioning --bucket "$bucket" --query Status --output text)" = Enabled
          key="production-transactional/email-final-${GITHUB_SHA}/les-buttes-production-integrations.zip"
          version="$(aws s3api put-object --bucket "$bucket" --key "$key" --body dist/les-buttes-production-integrations.zip --server-side-encryption AES256 --metadata source-commit="$GITHUB_SHA",release-scope="production-email-finalisation" --query VersionId --output text)"
          test -n "$version" && test "$version" != None
          echo "Private release key: $key" >> "$GITHUB_STEP_SUMMARY"
          echo "S3 version: $version" >> "$GITHUB_STEP_SUMMARY"
          echo "No Lambda, booking, payment, refund, or CloudFormation changes were performed." >> "$GITHUB_STEP_SUMMARY"
