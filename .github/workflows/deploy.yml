name: Build and deploy website
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, id-token: write }
concurrency: { group: production, cancel-in-progress: true }
env:
  AWS_ROLE_ARN: arn:aws:iam::145608514666:role/les-buttes-github-deploy
  AWS_REGION: eu-west-2
  S3_BUCKET: les-buttes-site-20260923204823029200000001
  CLOUDFRONT_DISTRIBUTION_ID: E1VSQS2DENGIJR
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Build production website with read-only booking master
        env:
          PUBLIC_BOOKING_REQUESTS_ENABLED: 'false'
          PUBLIC_BOOKING_SYNTHETIC_REQUESTS_ENABLED: 'false'
          PUBLIC_BOOKING_REQUESTS_APPROVED: 'false'
          PUBLIC_BOOKING_CONTROLLED_TEST_ENABLED: 'true'
          PUBLIC_BOOKING_REQUEST_API_URL: 'https://c7x0ongl4d.execute-api.eu-west-2.amazonaws.com'
          PUBLIC_BOOKING_TURNSTILE_SITE_KEY: '0x4AAAAAAF7u2N5Mlj1-UsnQ'
          PUBLIC_BOOKING_READ_ONLY_ENABLED: 'true'
          PUBLIC_BOOKING_AUTHORITATIVE_QUOTES_ENABLED: 'true'
          PUBLIC_BOOKING_READ_ONLY_ALLOWED_HOSTS: 'lesbuttes.com,www.lesbuttes.com'
          PUBLIC_BOOKING_QUOTE_URL: 'https://c7x0ongl4d.execute-api.eu-west-2.amazonaws.com/quote'
          PUBLIC_BOOKING_AVAILABILITY_URL: 'https://c7x0ongl4d.execute-api.eu-west-2.amazonaws.com/availability'
        run: |
          npm run build
          grep -RqlF 'c7x0ongl4d.execute-api.eu-west-2.amazonaws.com/quote' dist/_astro/
          grep -RqlF 'c7x0ongl4d.execute-api.eu-west-2.amazonaws.com/availability' dist/_astro/
          grep -RqlF '0x4AAAAAAF7u2N5Mlj1-UsnQ' dist/_astro/
          if grep -RqlF 'PUBLIC_BOOKING_REQUESTS_APPROVED' dist/; then
            echo 'Build unexpectedly contains an uncompiled booking activation flag' >&2
            exit 1
          fi
      - name: Upload assets
        run: aws s3 sync dist/ s3://${{ env.S3_BUCKET }}/ --delete --exclude "*.html" --exclude "*.xml" --exclude "*.txt" --cache-control "public,max-age=31536000,immutable"
      - name: Set video metadata
        run: |
          if [ -f dist/videos/explore-guernsey-web.mp4 ]; then
            aws s3 cp dist/videos/explore-guernsey-web.mp4 s3://${{ env.S3_BUCKET }}/videos/explore-guernsey-web.mp4 \
              --content-type "video/mp4" \
              --cache-control "public,max-age=31536000,immutable"
          fi
      - name: Upload HTML
        run: aws s3 sync dist/ s3://${{ env.S3_BUCKET }}/ --delete --exclude "*" --include "*.html" --include "*.xml" --include "*.txt" --cache-control "public,max-age=0,must-revalidate"
      - name: Refresh CloudFront
        run: aws cloudfront create-invalidation --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
