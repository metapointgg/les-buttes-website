name: Check mailing list AWS permissions

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/check-mailing-list-permissions.yml

permissions:
  contents: read
  id-token: write

env:
  AWS_ROLE_ARN: arn:aws:iam::145608514666:role/les-buttes-github-deploy

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: eu-west-2
      - name: Check read permissions
        shell: bash
        run: |
          set +e
          aws sts get-caller-identity >/dev/null 2>&1 && echo 'STS=allowed' || echo 'STS=denied'
          aws lambda list-functions --max-items 1 >/dev/null 2>&1 && echo 'LAMBDA_LIST=allowed' || echo 'LAMBDA_LIST=denied'
          aws sesv2 list-contact-lists --page-size 1 >/dev/null 2>&1 && echo 'SES_LIST=allowed' || echo 'SES_LIST=denied'
          aws apigatewayv2 get-apis --max-results 1 >/dev/null 2>&1 && echo 'APIGW_LIST=allowed' || echo 'APIGW_LIST=denied'
          aws iam get-role --role-name les-buttes-github-deploy >/dev/null 2>&1 && echo 'IAM_GET_ROLE=allowed' || echo 'IAM_GET_ROLE=denied'
          exit 0
