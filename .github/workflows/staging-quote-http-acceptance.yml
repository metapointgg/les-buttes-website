name: Staging quote HTTP acceptance (read-only)

on:
  push:
    branches:
      - feature/direct-booking-requests-27-night
    paths:
      - '.github/workflows/staging-quote-http-acceptance.yml'
      - 'services/booking-api/staging-quote-handler.mjs'
      - 'services/booking-api/published-band-quote.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quote-http:
    runs-on: ubuntu-latest
    steps:
      - name: Verify staging quote API Gateway responses
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://yo8p94y63b.execute-api.eu-west-2.amazonaws.com/quote'
          origin='https://d123fnjf47zmyp.cloudfront.net'
          check() {
            local name="$1" expected="$2" request_origin="$3" query="$4"
            local body code
            body="$(mktemp)"
            code="$(curl --silent --show-error --location --max-time 20 \
              --header "Origin: $request_origin" \
              --output "$body" --write-out '%{http_code}' \
              "$endpoint?$query")"
            echo "$name: HTTP $code (expected $expected)"
            if [ "$code" != "$expected" ]; then
              cat "$body"
              rm -f "$body"
              exit 1
            fi
            case "$name" in
              available)
                node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));if(d.totalGBP!=='1085.00'||d.bookingConfirmed!==false)process.exit(1)" "$body"
                ;;
              occupied)
                node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));if(!d.error)process.exit(1)" "$body"
                ;;
            esac
            rm -f "$body"
          }
          check available 200 "$origin" 'unit=geranium&guests=4&start=2027-07-03&end=2027-07-10'
          check occupied 422 "$origin" 'unit=geranium&guests=4&start=2027-08-28&end=2027-09-04'
          check wrong-origin 403 'https://lesbuttes.com' 'unit=geranium&guests=4&start=2027-07-03&end=2027-07-10'
          # Browser CORS preflight is a separate HTTP exchange from GET.
          headers="$(mktemp)"
          preflight="$(curl --silent --show-error --max-time 20 --request OPTIONS \
            --header "Origin: $origin" \
            --header 'Access-Control-Request-Method: GET' \
            --dump-header "$headers" --output /dev/null --write-out '%{http_code}' "$endpoint")"
          echo "CORS preflight: HTTP $preflight"
          test "$preflight" = '200' || test "$preflight" = '204'
          grep -Eiq '^access-control-allow-origin: https://d123fnjf47zmyp.cloudfront.net' "$headers"
          grep -Eiq '^access-control-allow-methods:.*GET' "$headers"
          rm -f "$headers"
