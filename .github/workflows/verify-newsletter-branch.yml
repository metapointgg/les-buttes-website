name: Verify newsletter branch

on:
  push:
    branches: [newsletter-signup]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Validate CloudFormation template
        run: |
          python -m pip install --quiet cfn-lint
          cfn-lint infrastructure/newsletter.yml
      - name: Check mailing list endpoint and CORS
        shell: bash
        run: |
          set -euo pipefail
          response_headers=$(mktemp)
          response_body=$(mktemp)
          status=$(curl -sS \
            -D "$response_headers" \
            -o "$response_body" \
            -w '%{http_code}' \
            -X POST \
            'https://pm3pvll5tvvzcpkoaou4oecfiy0woyxx.lambda-url.eu-west-2.on.aws/' \
            -H 'Origin: https://dlcz0zbfk8xnp.cloudfront.net' \
            -H 'Content-Type: application/json' \
            --data '{"email":"healthcheck@example.com","consent":true,"website":"automated-health-check","source":"/health-check/"}')
          test "$status" = "200"
          grep -qi 'access-control-allow-origin: https://dlcz0zbfk8xnp.cloudfront.net' "$response_headers"
          grep -q '"ok":true' "$response_body"
