name: Staging payment route public authorizer smoke (read-only)
on:
  workflow_dispatch:
  push:
    branches: [feature/direct-booking-requests-27-night]
    paths:
      - '.github/workflows/staging-payment-route-smoke.yml'
      - 'services/booking-api/staging-payment-route-handler.mjs'
      - 'services/booking-api/staging-canonical-payment-route-review.template.yaml'
permissions:
  contents: read
jobs:
  verify-gateway-denies-unauthenticated:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify canonical API rejects unauthenticated payment reconciliation
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://i2irz87c82.execute-api.eu-west-2.amazonaws.com/admin/bookings/12345678-1234-1234-1234-123456789abc/payment/reconcile'
          probe() {
            label="$1"
            shift
            code="$(curl --silent --show-error --max-time 15 \
              --output /dev/null --write-out '%{http_code}' "$@" "$endpoint")"
            case "$code" in
              401|403) echo "$label rejected by API Gateway: HTTP $code" ;;
              *) echo "::error::$label returned HTTP $code (expected 401/403)" >&2; exit 1 ;;
            esac
          }
          probe 'Unauthenticated POST' --request POST --header 'Content-Type: application/json' --data '{}'
          probe 'Invalid bearer POST' --request POST --header 'Content-Type: application/json' --header 'Authorization: Bearer deliberately-invalid' --data '{}'
          {
            echo '### Canonical staging payment API authorizer smoke'
            echo 'Unauthenticated and invalid-token POST requests were rejected.'
            echo 'No Cognito credentials, AWS credentials, payment writes, or guest messages were used.'
            echo 'This does not establish authenticated owner access or payment lifecycle acceptance.'
          } >> "$GITHUB_STEP_SUMMARY"
