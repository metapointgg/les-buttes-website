name: Booking consolidated acceptance (staging, read-only)

on:
  push:
    branches: [feature/direct-booking-requests-27-night]
    paths:
      - '.github/workflows/booking-consolidated-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consolidated-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Layer 1 - booking and discovery regression tests
        run: |
          set -euo pipefail
          npm run test:booking
          npm run test:discovery
      - name: Layer 2 - real quote, conflicts, origin and CORS
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://yo8p94y63b.execute-api.eu-west-2.amazonaws.com/quote'
          origin='https://d123fnjf47zmyp.cloudfront.net'
          check() {
            local name="$1" expected="$2" request_origin="$3" query="$4"
            local body code
            body="$(mktemp)"
            code="$(curl --silent --show-error --max-time 20 --header "Origin: $request_origin" --output "$body" --write-out '%{http_code}' "$endpoint?$query")"
            echo "$name HTTP $code (expected $expected)"
            test "$code" = "$expected" || { cat "$body"; exit 1; }
            case "$name" in
              available) node -e "const d=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));if(d.totalGBP!=='1085.00'||d.bookingConfirmed!==false)process.exit(1)" "$body" ;;
              occupied) node -e "const d=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));if(!d.error)process.exit(1)" "$body" ;;
            esac
            rm -f "$body"
          }
          check available 200 "$origin" 'unit=geranium&guests=4&start=2027-07-03&end=2027-07-10'
          check occupied 422 "$origin" 'unit=geranium&guests=4&start=2027-08-28&end=2027-09-04'
          check wrong-origin 403 'https://lesbuttes.com' 'unit=geranium&guests=4&start=2027-07-03&end=2027-07-10'
          headers="$(mktemp)"
          status="$(curl -sS --max-time 20 -X OPTIONS -H "Origin: $origin" -H 'Access-Control-Request-Method: GET' -D "$headers" -o /dev/null -w '%{http_code}' "$endpoint")"
          test "$status" = 200 || test "$status" = 204
          grep -Eiq '^access-control-allow-origin: https://d123fnjf47zmyp.cloudfront.net' "$headers"
          grep -Eiq '^access-control-allow-methods:.*GET' "$headers"
      - name: Layer 2b - public master availability required by interactive journey
        shell: bash
        run: |
          set -euo pipefail
          url='https://ktmv4x1i3b.execute-api.eu-west-2.amazonaws.com/availability'
          curl --fail --silent --show-error --max-time 20 --header 'Origin: https://d123fnjf47zmyp.cloudfront.net' "$url" > /tmp/les-buttes-master-availability.json
          node --input-type=module -e '
            import fs from "node:fs";
            import preview from "./src/data/booking-preview-2027.json" with {type:"json"};
            const d=JSON.parse(fs.readFileSync("/tmp/les-buttes-master-availability.json","utf8"));
            if(d.mode!=="LIVE_STAGING_MASTER_READ_ONLY")throw Error("Unexpected availability mode");
            for(const k of ["firstNight","lastNight","lastCheckout"]){
              if(d[k]!==preview[k])throw Error("Availability season mismatch: "+k);
            }
            if(!Number.isFinite(Date.parse(d.capturedAt))||Math.abs(Date.now()-Date.parse(d.capturedAt))>120000)throw Error("Stale availability snapshot");
            for(const unit of ["geranium","honeysuckle"]){
              if(!Array.isArray(d.blocked?.[unit]))throw Error("Missing occupied-date blocks: "+unit);
            }
            console.log("Public staging availability feed is fresh and matches browser contract");
          '
      - name: Layer 3 - deployed website, served browser code and safety flags
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import urllib.request
          from urllib.parse import urljoin
          base='https://d123fnjf47zmyp.cloudfront.net'
          with urllib.request.urlopen(base+'/book/',timeout=20) as response:
              html=response.read().decode()
              assert response.status==200
          assert 'data-booking-form' not in html
          scripts=re.findall(r'<script[^>]+src="([^"]+)"',html)
          scripts+=re.findall(r'"(/_astro/[^"]+\\.js)"',html)
          scripts=list(dict.fromkeys(scripts))
          assert scripts, 'No browser script links found'
          found=False
          for src in scripts:
              if not (src.startswith('/_astro/') or src.startswith(base+'/_astro/')):
                  continue
              with urllib.request.urlopen(urljoin(base,src),timeout=20) as response:
                  found |= 'yo8p94y63b.execute-api.eu-west-2.amazonaws.com/quote' in response.read().decode()
          assert found, 'Quote endpoint not present in published browser scripts'
          print('CloudFront page and published authoritative quote asset verified')
          PY
      - name: Layer 3b - interactive browser booking journey (read-only)
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          try{
            const page=await browser.newPage();
            const errors=[],mutations=[];
            page.on('request',request=>{if(request.method()==='POST'&&request.url().includes('75im3kpaq6'))mutations.push(request.url());});
            page.on('pageerror',error=>errors.push(error.message));
            await page.goto('https://d123fnjf47zmyp.cloudfront.net/book/',{waitUntil:'domcontentloaded'});
            await page.locator('[data-discovery-search] [name="arrival"]').fill('2027-07-03');
            await page.locator('[data-discovery-search] [name="departure"]').fill('2027-07-10');
            await page.locator('[data-discovery-search] [name="adults"]').fill('2');
            await page.locator('[data-discovery-search] button[type="submit"]').click();
            await page.locator('[data-booking-step="2"]:visible').waitFor();
            await page.locator('[data-discovery-option="geranium"] [data-select-option]').click();
            const next=page.locator('[data-continue-review]');
            await next.waitFor();
            if(await next.isDisabled())throw Error('Review button disabled after selecting available stay');
            await next.click();
            await page.locator('[data-booking-step="3"]:visible').waitFor();
            const review=(await page.locator('[data-summary-direct]').innerText()).trim();
            if(!review.includes('1,085'))throw Error('Review does not display authoritative GBP 1085: '+review);
            await page.locator('[data-continue-details]').click();
            await page.locator('[data-booking-step="4"]:visible').waitFor();
            const details=(await page.locator('[data-details-price]').innerText()).trim();
            if(review!==details)throw Error('Authoritative review/details prices disagree: '+review+' / '+details);
            if(new URL(page.url()).hostname!=='d123fnjf47zmyp.cloudfront.net')throw Error('Synthetic form outside staging preview');
            if(mutations.length)throw Error('Read-only browser check submitted a booking');
            if(errors.length)throw Error('Browser JS errors: '+errors.join('; '));
            console.log('PASS: four-step browser journey, authoritative review/details '+review+', no booking submitted');
          }finally{await browser.close();}
          JS
      - name: Layer 4 - release evidence and remaining gates
        if: always()
        run: |
          {
            echo '## Consolidated booking acceptance'
            echo 'Read-only layers: backend regression, live quote/CORS, deployed CloudFront assets.'
            echo ''
            echo '### NOT COVERED — must not be reported as passed'
            echo '- Guest booking request creation and atomic reservation'
            echo '- Canonical owner approval/rejection and audit'
            echo '- SumUp sandbox checkout, verified payment and idempotency'
            echo '- Confirmation emails, cancellation, refund and date release'
            echo '- Interactive browser journey is covered by Layer 3b (read-only); check its result'
            echo ''
            echo 'Production release remains NO GO. This workflow never creates bookings or charges payments.'
          } >> "$GITHUB_STEP_SUMMARY"
