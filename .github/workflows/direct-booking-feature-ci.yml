name: Direct booking feature CI (no deployment)
on:
  push:
    branches: [feature/direct-booking-requests-27-night]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: booking-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Astro build, link checks, booking API and discovery tests
        run: npm test
      - name: Check booking pages generated in all languages
        run: |
          set -euo pipefail
          for page in dist/book/index.html dist/fr/book/index.html dist/nl/book/index.html; do
            test -s "$page"
            echo "Verified $page"
          done
      - name: Verify staging safety gates
        run: node scripts/check-booking-staging-readiness.mjs
      - name: Install AWS SAM CLI for offline template validation
        uses: aws-actions/setup-sam@v2
      - name: Validate private staging availability infrastructure (no deployment)
        run: |
          set -euo pipefail
          sam validate --lint --template-file services/booking-api/staging-availability-private.template.yaml --region eu-west-2
      - name: Build private staging availability Lambda (no deployment)
        run: |
          set -euo pipefail
          sam build --template-file services/booking-api/staging-availability-private.template.yaml --build-dir .aws-sam/private-availability-build --region eu-west-2
          test -s .aws-sam/private-availability-build/template.yaml
          test -s .aws-sam/private-availability-build/PrivateStagingAvailabilityFunction/staging-availability-handler.mjs
      - name: Upload validated static website
        uses: actions/upload-artifact@v4
        with:
          name: direct-booking-site-${{ github.sha }}
          path: dist/
          retention-days: 7
          if-no-files-found: error
