name: Booking management staging validation
on:
  pull_request:
    paths:
      - "services/booking-api/**"
      - "management-preview/**"
      - "infra/booking-api/**"
      - ".github/workflows/booking-admin-validation.yml"
  push:
    branches:
      - feature/direct-booking-requests-27-night
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend dependencies
        run: npm --prefix services/booking-api install --no-audit --no-fund
      - name: Backend syntax and unit tests
        run: |
          npm --prefix services/booking-api run check
          npm --prefix services/booking-api test
      - name: Management preview model tests and syntax
        run: |
          node --check management-preview/app.mjs
          node --check management-preview/model.mjs
          node --check management-preview/hosted-auth.mjs
          node --test management-preview/model.test.mjs management-preview/hosted-auth.test.mjs
      - name: Hosted management staging HTTP smoke (no credentials)
        shell: bash
        run: |
          set -euo pipefail
          site='https://d123fnjf47zmyp.cloudfront.net/management'
          api='https://g2vazft1vb.execute-api.eu-west-2.amazonaws.com'
          curl -fsSL --retry 3 --retry-delay 2 --max-time 20 -o /tmp/lb-management.html "$site/index.html"
          grep -Fq 'id="sign-in"' /tmp/lb-management.html
          curl -fsSL --retry 3 --retry-delay 2 --max-time 20 -o /tmp/lb-management-auth.mjs "$site/hosted-auth.mjs"
          grep -Fq '1a0i42vp4gi24i5orh8i4jjhmr' /tmp/lb-management-auth.mjs
          curl -fsSL --retry 3 --retry-delay 2 --max-time 20 -o /tmp/lb-management-app.mjs "$site/app.mjs"
          grep -Fq 'completeHostedSignIn' /tmp/lb-management-app.mjs
          response="$(curl -sS --max-time 20 --output /dev/null --write-out '%{http_code}' "$api/admin/bookings")"
          echo "Unauthenticated staging booking-list status: $response"
          test "$response" = '401' || test "$response" = '403'
          headers="$(curl -sS --max-time 20 -i -X OPTIONS -H 'Origin: https://d123fnjf47zmyp.cloudfront.net' -H 'Access-Control-Request-Method: GET' "$api/admin/bookings")"
          echo "$headers" | grep -iq '^access-control-allow-origin: https://d123fnjf47zmyp.cloudfront.net'
          echo 'Hosted read-only management site and unauthenticated API boundary verified; actual Cognito browser sign-in still required.' >> "$GITHUB_STEP_SUMMARY"
      - uses: aws-actions/setup-sam@v2
      - name: Validate SAM template without deployment
        run: |
          sam validate --lint --template-file infra/booking-api/template.yaml
          sam validate --lint --template-file services/booking-api/staging-management-preview-isolated.template.yaml
