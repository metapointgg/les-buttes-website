AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Les Buttes direct booking request API - intentionally disabled until configuration is complete.

Parameters:
  BookingEnvironment:
    Type: String
    AllowedValues: ['staging', 'production']
    Default: staging
  StagingApiToken:
    Type: String
    NoEcho: true
    Default: ''
    Description: Required 24+ character secret for every staging request; never required by production.
  AllowedOrigin:
    Type: String
    Default: https://lesbuttes.com
  AllowedWwwOrigin:
    Type: String
    Default: https://www.lesbuttes.com
  BookingRequestsEnabled:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
  BookingRulesJson:
    Type: AWS::SSM::Parameter::Value<String>
    Description: Name of SSM String parameter containing explicitly approved date/minimum stay JSON.
  BookingRatesJson:
    Type: AWS::SSM::Parameter::Value<String>
    Description: Name of SSM String parameter containing GBP nightly rates and approval status.
  CalendarToken:
    Type: String
    NoEcho: true
    MinLength: 24
    Description: Random bearer token required to read the no-PII Airbnb iCal feeds.
  TurnstileSecret:
    Type: String
    NoEcho: true
    Description: Cloudflare Turnstile private server verification secret.
  NotifyFrom:
    Type: String
    Default: ''
    Description: Verified SES sender for host notifications.
  NotifyTo:
    Type: String
    Default: ''
    Description: Host email receiving new booking requests.

  CalendarMonitorEnabled:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: Explicit opt-in for staging-only automated Airbnb calendar checking.
  CalendarMonitorAlertEmail:
    Type: String
    Default: ''
    Description: Recipient must confirm SNS email subscription before alerts are delivered.
  CalendarMonitorStart:
    Type: String
    Default: '2027-03-20'
    Description: Inclusive first occupied night compared with Airbnb in staging.
  CalendarMonitorEnd:
    Type: String
    Default: '2027-10-02'
    Description: Exclusive departure date for Airbnb comparisons.
  GeraniumAirbnbUrlSsmPath:
    Type: String
    Default: '/les-buttes/booking/staging/airbnb/geranium-url'
    AllowedPattern: '/les-buttes/booking/staging/airbnb/[a-z0-9-]+'
    Description: Name only, not value; actual private URL is an SSM SecureString.
  HoneysuckleAirbnbUrlSsmPath:
    Type: String
    Default: '/les-buttes/booking/staging/airbnb/honeysuckle-url'
    AllowedPattern: '/les-buttes/booking/staging/airbnb/[a-z0-9-]+'
    Description: Name only, not value; actual private URL is an SSM SecureString.

Conditions:
  MonitoringEnabledCondition: !And
    - !Equals [!Ref CalendarMonitorEnabled, 'true']
    - !Equals [!Ref BookingEnvironment, 'staging']

Resources:
  BookingTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  BookingApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: [!Ref AllowedOrigin, !Ref AllowedWwwOrigin]
        AllowMethods: ['GET', 'POST', 'OPTIONS']
        AllowHeaders: ['content-type']
        MaxAge: 300

  BookingFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs22.x
      Handler: index.handler
      CodeUri: ../../services/booking-api/
      MemorySize: 256
      Timeout: 12
      Environment:
        Variables:
          BOOKINGS_TABLE: !Ref BookingTable
          BOOKING_ENVIRONMENT: !Ref BookingEnvironment
          STAGING_API_TOKEN: !Ref StagingApiToken
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          BOOKING_REQUESTS_ENABLED: !Ref BookingRequestsEnabled
          BOOKING_RULES_JSON: !Ref BookingRulesJson
          BOOKING_RATES_JSON: !Ref BookingRatesJson
          TURNSTILE_SECRET: !Ref TurnstileSecret
          CALENDAR_TOKEN: !Ref CalendarToken
          NOTIFY_FROM: !Ref NotifyFrom
          NOTIFY_TO: !Ref NotifyTo
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BookingTable
        - Statement:
            Effect: Allow
            Action: ['ses:SendEmail']
            Resource: '*'
      Events:
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref BookingApi
            Path: /{proxy+}
            Method: ANY

  CalendarMonitorCheckpointTable:
    Condition: MonitoringEnabledCondition
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH

  CalendarMonitorAlertTopic:
    Condition: MonitoringEnabledCondition
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: Les Buttes booking staging calendar alerts

  CalendarMonitorEmailSubscription:
    Condition: MonitoringEnabledCondition
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref CalendarMonitorAlertTopic
      Protocol: email
      Endpoint: !Ref CalendarMonitorAlertEmail

  CalendarMonitorFailureAlarm:
    Condition: MonitoringEnabledCondition
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Staging Airbnb calendar monitor failed; manual calendar review required.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref CalendarMonitorFunction
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref CalendarMonitorAlertTopic

  CalendarMonitorFunction:
    Condition: MonitoringEnabledCondition
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs22.x
      Handler: monitor-airbnb.handler
      CodeUri: ../../services/booking-api/
      MemorySize: 256
      Timeout: 90
      Environment:
        Variables:
          BOOKING_ENVIRONMENT: !Ref BookingEnvironment
          BOOKINGS_TABLE: !Ref BookingTable
          MONITOR_STATE_TABLE: !Ref CalendarMonitorCheckpointTable
          MONITOR_SNS_TOPIC_ARN: !Ref CalendarMonitorAlertTopic
          MONITOR_FROM_DATE: !Ref CalendarMonitorStart
          MONITOR_TO_DATE: !Ref CalendarMonitorEnd
          MONITOR_GERANIUM_SSM: !Ref GeraniumAirbnbUrlSsmPath
          MONITOR_HONEYSUCKLE_SSM: !Ref HoneysuckleAirbnbUrlSsmPath
      Policies:
        - Statement:
            Effect: Allow
            Action: ['dynamodb:Query', 'dynamodb:BatchGetItem']
            Resource: !GetAtt BookingTable.Arn
        - Statement:
            Effect: Allow
            Action: ['dynamodb:GetItem', 'dynamodb:PutItem']
            Resource: !GetAtt CalendarMonitorCheckpointTable.Arn
        - Statement:
            Effect: Allow
            Action: ['ssm:GetParameter']
            Resource:
              - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${GeraniumAirbnbUrlSsmPath}
              - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${HoneysuckleAirbnbUrlSsmPath}
        - Statement:
            Effect: Allow
            Action: ['sns:Publish']
            Resource: !Ref CalendarMonitorAlertTopic
      Events:
        EveryFourHours:
          Type: Schedule
          Properties:
            Schedule: rate(4 hours)
            Enabled: true
            Description: Review live Airbnb calendars against isolated Les Buttes staging booking dates every four hours; never auto-edit bookings.

Outputs:

  CalendarMonitorFunctionName:
    Condition: MonitoringEnabledCondition
    Description: Lambda to invoke a one-off staging-only Airbnb calendar audit.
    Value: !Ref CalendarMonitorFunction
  CalendarMonitorAlertTopicArn:
    Condition: MonitoringEnabledCondition
    Description: SNS topic for Airbnb availability review; email subscription requires recipient confirmation.
    Value: !Ref CalendarMonitorAlertTopic
  ApiUrl:
    Description: API root for PUBLIC_BOOKING_API_URL at website build time (do not configure until ready).
    Value: !Sub https://${BookingApi}.execute-api.${AWS::Region}.amazonaws.com
  BookingTableName:
    Description: Private DynamoDB table name for the host admin CLI.
    Value: !Ref BookingTable
