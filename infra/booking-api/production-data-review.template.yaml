AWSTemplateFormatVersion: '2010-09-09'
Description: Les Buttes isolated production booking data only. No public API, payments, emails or booking activation.
Conditions:
  ApprovedAccountAndRegion: !And
    - !Equals [!Ref AWS::AccountId, '145608514666']
    - !Equals [!Ref AWS::Region, eu-west-2]
Resources:
  BookingTable:
    Condition: ApprovedAccountAndRegion
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: BookingRequestsIndex
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes: [guests, requestedAt, units, status, end, id, start]
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      Tags:
        - Key: Project
          Value: LesButtes
        - Key: Environment
          Value: production
Outputs:
  BookingTableName:
    Condition: ApprovedAccountAndRegion
    Value: !Ref BookingTable
