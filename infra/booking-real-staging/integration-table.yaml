AWSTemplateFormatVersion: '2010-09-09'
Description: Isolated, disposable synthetic-only transaction test table. Never used by guest APIs.
Resources:
  SyntheticTransactionTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false
      SSESpecification:
        SSEEnabled: true
Outputs:
  SyntheticTransactionTableName:
    Value: !Ref SyntheticTransactionTable
  SyntheticTransactionTableArn:
    Value: !GetAtt SyntheticTransactionTable.Arn
