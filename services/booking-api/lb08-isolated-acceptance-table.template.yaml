AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  LB-08 isolated disposable DynamoDB acceptance-test table.
  Never point the public booking API, availability bridge or management app at this table.
Resources:
  IsolatedBookingAcceptanceTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: les-buttes-lb08-isolated-acceptance
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      Tags:
        - Key: Application
          Value: les-buttes
        - Key: Environment
          Value: staging-acceptance-isolated
        - Key: Purpose
          Value: lb08-synthetic-payment-confirmation
Outputs:
  TableName:
    Value: !Ref IsolatedBookingAcceptanceTable
  TableArn:
    Value: !GetAtt IsolatedBookingAcceptanceTable.Arn
