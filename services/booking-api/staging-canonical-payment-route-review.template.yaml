AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  REVIEW ONLY - disabled Node.js staging payment endpoint integrated into existing
  canonical owner API. Do not execute without owner approval and IAM review.
Parameters:
  AutomaticReconciliationEnabled:
    Type: String
    AllowedValues: ['false', 'true']
    Default: 'false'
  CanonicalApiId:
    Type: String
    AllowedValues: [i2irz87c82]
  StagingBookingTableName:
    Type: String
    AllowedPattern: '^les-buttes-booking-staging-BookingTable-[A-Za-z0-9]+$'
  CognitoAuthorizerId:
    Type: String
    AllowedValues: [q9ukxh]
    Description: Verified existing JWT authorizer on canonical API i2irz87c82 (5 November 2026).
  ReviewedArtifactBucket:
    Type: String
    MinLength: 3
    Description: Explicitly approved S3 bucket containing the packaged Node.js Lambda.
  ReviewedArtifactKey:
    Type: String
    MinLength: 1
    Description: Explicitly approved immutable versioned Lambda artefact key.
  ReviewedArtifactVersion:
    Type: String
    MinLength: 1
    AllowedPattern: '^[A-Za-z0-9._~+/=-]+$'
    Description: Required S3 object version ID from a versioning-enabled reviewed artefact bucket; unversioned buckets are not acceptable.
  DeploymentEnabled:
    Type: String
    AllowedValues: ['false', 'true']
    Default: 'false'
  StagingPaymentWritesEnabled:
    Type: String
    AllowedValues: ['false', 'true']
    Default: 'false'
    Description: Separate owner-approved switch; never enable for initial route deployment.
  StagingPolicyRefundAcceptanceEnabled:
    Type: String
    AllowedValues: ['false', 'true']
    Default: 'false'
    Description: Staging synthetic SumUp policy-refund acceptance only; never enable in production.
  StagingConfirmationDispatchEnabled:
    Type: String
    AllowedValues: ['false', 'true']
    Default: 'false'
    Description: Staging SES simulator confirmation delivery only; IAM prevents delivery to real recipients.
  StagingLifecycleDispatchEnabled:
    Type: String
    AllowedValues: ['false', 'true']
    Default: 'false'
    Description: Staging SES simulator lifecycle delivery only; IAM prevents delivery to real recipients.
Conditions:
  AutomaticReconciliation: !Equals [!Ref AutomaticReconciliationEnabled, 'true']
  ApprovedStagingDeployment: !Equals [!Ref DeploymentEnabled, 'true']
  CorrectRegion: !Equals [!Ref AWS::Region, eu-west-2]
  Deploy: !And [!Condition ApprovedStagingDeployment, !Condition CorrectRegion]
Resources:
  PaymentReconciliationRole:
    Type: AWS::IAM::Role
    Condition: Deploy
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StagingBookingRequestIndex
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: dynamodb:Query
                Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${StagingBookingTableName}/index/BookingRequestsIndex'
        - PolicyName: StagingSimulatorEmailOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ses:SendEmail
                Resource:
                  - arn:aws:ses:us-east-1:145608514666:identity/lesbuttes.com
                  - arn:aws:ses:us-east-1:145608514666:configuration-set/my-first-configuration-set
                Condition:
                  StringEquals:
                    ses:FromAddress: info@lesbuttes.com
                  ForAllValues:StringEquals:
                    ses:Recipients: [success@simulator.amazonses.com]
        - PolicyName: LambdaStagingDiagnosticLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*'
        - PolicyName: StagingBookingReadOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem]
                Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${StagingBookingTableName}'
        - PolicyName: StagingSumUpParameterRead
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [ssm:GetParameter]
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/les-buttes/staging/sumup/api-key'
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/les-buttes/staging/sumup/merchant-code'
        - PolicyName: StagingAtomicPaymentConfirmation
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:ConditionCheckItem]
                Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${StagingBookingTableName}'
  PaymentReconciliationFunction:
    Type: AWS::Lambda::Function
    Condition: Deploy
    Properties:
      Runtime: nodejs22.x
      Handler: staging-payment-route-handler.handler
      Role: !GetAtt PaymentReconciliationRole.Arn
      Timeout: 120
      MemorySize: 256
      ReservedConcurrentExecutions: 2
      Code:
        S3Bucket: !Ref ReviewedArtifactBucket
        S3Key: !Ref ReviewedArtifactKey
        S3ObjectVersion: !Ref ReviewedArtifactVersion
      Environment:
        Variables:
          BOOKING_LIFECYCLE_DISPATCH_ENABLED: !Ref StagingLifecycleDispatchEnabled
          BOOKING_SES_SIMULATOR_ENABLED: 'true'
          BOOKING_SES_REGION: us-east-1
          BOOKING_SES_SANDBOX_ACK: 'true'
          BOOKING_SES_FROM: info@lesbuttes.com
          BOOKING_SES_TEST_RECIPIENTS: success@simulator.amazonses.com
          BOOKING_AUTOMATIC_RECONCILIATION_ENABLED: !Ref AutomaticReconciliationEnabled
          BOOKING_SANDBOX_REFUND_ACCEPTANCE: 'false'
          BOOKING_SANDBOX_POLICY_REFUND_ACCEPTANCE: !Ref StagingPolicyRefundAcceptanceEnabled
          BOOKING_AIRBNB_REQUIRED: 'true'
          BOOKING_ENVIRONMENT: staging
          MANAGEMENT_COGNITO_ISSUER: https://cognito-idp.eu-west-2.amazonaws.com/eu-west-2_Wvo0I3cTa
          MANAGEMENT_COGNITO_CLIENT_ID: 2mjmimjh7oc8h00d4nngrc1akj
          BOOKINGS_TABLE: !Ref StagingBookingTableName
          MANAGEMENT_WRITES_ENABLED: !Ref StagingPaymentWritesEnabled
          MANAGEMENT_PAYMENT_RECONCILIATION_ENABLED: !Ref StagingPaymentWritesEnabled
          MANAGEMENT_APPROVAL_ENABLED: 'false'
          MANAGEMENT_CHECKOUT_ENABLED: 'false'
          BOOKING_CONFIRMATION_DISPATCH_ENABLED: !Ref StagingConfirmationDispatchEnabled
          BOOKING_EMAILS_ENABLED: 'false'
  PaymentReconciliationIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Condition: Deploy
    Properties:
      ApiId: !Ref CanonicalApiId
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt PaymentReconciliationFunction.Arn
      PayloadFormatVersion: '2.0'
  PaymentReconciliationRoute:
    Type: AWS::ApiGatewayV2::Route
    Condition: Deploy
    Properties:
      ApiId: !Ref CanonicalApiId
      RouteKey: 'POST /admin/bookings/{bookingId}/payment/reconcile'
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoAuthorizerId
      Target: !Sub 'integrations/${PaymentReconciliationIntegration}'
  PaymentReconciliationPermission:
    Type: AWS::Lambda::Permission
    Condition: Deploy
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref PaymentReconciliationFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${CanonicalApiId}/*/POST/admin/bookings/*/payment/reconcile'
  AutomaticPaymentRule:
    Type: AWS::Events::Rule
    Condition: Deploy
    Properties:
      Name: les-buttes-sandbox-payment-reconciliation
      ScheduleExpression: rate(2 minutes)
      State: !If [AutomaticReconciliation, ENABLED, DISABLED]
      Targets:
        - Id: StagingPaymentReconciliation
          Arn: !GetAtt PaymentReconciliationFunction.Arn
  AutomaticPaymentPermission:
    Type: AWS::Lambda::Permission
    Condition: Deploy
    Properties:
      FunctionName: !Ref PaymentReconciliationFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt AutomaticPaymentRule.Arn
      SourceAccount: !Ref AWS::AccountId
Outputs:
  ReviewStatus:
    Value: 'Review-only template; DeploymentEnabled defaults to false. Staging-only DynamoDB transaction and SumUp SSM access are scoped; payment writes require a separate default-off owner switch and SES is restricted to the staging simulator.'
