AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  REVIEW ONLY - staging owner-action endpoint integrated into existing
  canonical owner API. Do not execute without owner approval and IAM review.
Parameters:
  CanonicalApiId:
    Type: String
    AllowedValues: [i2irz87c82]
  StagingBookingTableName:
    Type: String
    AllowedPattern: '^les-buttes-booking-staging-BookingTable-[A-Za-z0-9]+$'
  CognitoAuthorizerId:
    Type: String
    AllowedValues: [q9ukxh]
    Description: Verified existing JWT authorizer on canonical API i2irz87c82 (5 November 2026).
  ReviewedArtifactBucket:
    Type: String
    MinLength: 3
    Description: Explicitly approved S3 bucket containing the packaged Node.js Lambda.
  ReviewedArtifactKey:
    Type: String
    MinLength: 1
    Description: Explicitly approved immutable versioned Lambda artefact key.
  ReviewedArtifactVersion:
    Type: String
    MinLength: 1
    AllowedPattern: '^[A-Za-z0-9._~+/=-]+$'
    Description: Required S3 object version ID from a versioning-enabled reviewed artefact bucket; unversioned buckets are not acceptable.
  DeploymentEnabled:
    Type: String
    AllowedValues: ['false', 'true']
    Default: 'false'
  StagingOwnerActionsEnabled:
    Type: String
    AllowedValues: ['false', 'true']
    Default: 'false'
    Description: Separate owner-approved switch; never enable for initial route deployment.
Conditions:
  ApprovedStagingDeployment: !Equals [!Ref DeploymentEnabled, 'true']
  CorrectRegion: !Equals [!Ref AWS::Region, eu-west-2]
  Deploy: !And [!Condition ApprovedStagingDeployment, !Condition CorrectRegion]
Resources:
  OwnerActionRole:
    Type: AWS::IAM::Role
    Condition: Deploy
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LambdaStagingDiagnosticLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*'
        - PolicyName: StagingBookingReadOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem]
                Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${StagingBookingTableName}'
        - PolicyName: StagingAtomicOwnerDecision
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:TransactWriteItems]
                Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${StagingBookingTableName}'
  OwnerActionFunction:
    Type: AWS::Lambda::Function
    Condition: Deploy
    Properties:
      Runtime: nodejs22.x
      Handler: staging-owner-action-route-handler.handler
      Role: !GetAtt OwnerActionRole.Arn
      Timeout: 12
      MemorySize: 256
      ReservedConcurrentExecutions: 2
      Code:
        S3Bucket: !Ref ReviewedArtifactBucket
        S3Key: !Ref ReviewedArtifactKey
        S3ObjectVersion: !Ref ReviewedArtifactVersion
      Environment:
        Variables:
          BOOKING_ENVIRONMENT: staging
          MANAGEMENT_COGNITO_ISSUER: https://cognito-idp.eu-west-2.amazonaws.com/eu-west-2_Wvo0I3cTa
          MANAGEMENT_COGNITO_CLIENT_ID: 2mjmimjh7oc8h00d4nngrc1akj
          BOOKINGS_TABLE: !Ref StagingBookingTableName
          MANAGEMENT_WRITES_ENABLED: !Ref StagingOwnerActionsEnabled
          MANAGEMENT_APPROVAL_ENABLED: !Ref StagingOwnerActionsEnabled
          MANAGEMENT_PAYMENT_RECONCILIATION_ENABLED: 'false'
          MANAGEMENT_CHECKOUT_ENABLED: 'false'
          BOOKING_CONFIRMATION_DISPATCH_ENABLED: 'false'
          BOOKING_EMAILS_ENABLED: 'false'
  OwnerActionIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Condition: Deploy
    Properties:
      ApiId: !Ref CanonicalApiId
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt OwnerActionFunction.Arn
      PayloadFormatVersion: '2.0'
  OwnerActionRoute:
    Type: AWS::ApiGatewayV2::Route
    Condition: Deploy
    Properties:
      ApiId: !Ref CanonicalApiId
      RouteKey: 'POST /admin/bookings/{bookingId}/actions/{action}'
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoAuthorizerId
      Target: !Sub 'integrations/${OwnerActionIntegration}'
  OwnerActionPermission:
    Type: AWS::Lambda::Permission
    Condition: Deploy
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref OwnerActionFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${CanonicalApiId}/*/POST/admin/bookings/*/actions/*'
Outputs:
  ReviewStatus:
    Value: 'Review-only template; DeploymentEnabled defaults to false. Staging-only DynamoDB transaction access is scoped; owner actions require a separate default-off switch; no SumUp, SES or production table permissions are granted.'
